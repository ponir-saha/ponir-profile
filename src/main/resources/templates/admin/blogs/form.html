<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head(${post.id == null ? 'New post' : 'Edit post'})}"></head>
<body class="admin-body"><div class="admin-shell"><aside th:replace="~{fragments/admin :: sidebar('blogs')}"></aside><div class="admin-main"><header th:replace="~{fragments/admin :: topbar('Blog posts')}"></header>
<main class="admin-content"><div class="admin-page-head"><div><p>Writing</p><h1 th:text="${post.id == null ? 'Create blog post' : 'Edit blog post'}">Post</h1></div></div>
<form class="admin-form-card" th:action="@{/admin/blogs}" th:object="${post}" method="post" enctype="multipart/form-data"><input type="hidden" th:field="*{id}"><div class="alert error" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Upload error</div>
<label><span>Title</span><input th:field="*{title}" data-slug-source required><small class="field-error" th:errors="*{title}"></small></label><div class="form-grid two"><label><span>URL slug</span><input th:field="*{slug}" data-slug-target><small class="field-error" th:errors="*{slug}"></small></label><label><span>Category</span><input th:field="*{category}" placeholder="Architecture" required><small class="field-error" th:errors="*{category}"></small></label></div>
<label><span>Excerpt</span><textarea th:field="*{excerpt}" rows="4" required></textarea><small class="field-error" th:errors="*{excerpt}"></small></label><label><span>Article body (Markdown)</span><textarea th:field="*{content}" rows="22" placeholder="## Section title&#10;&#10;Plain text and `inline code`.&#10;&#10;```java&#10;public void example() {}&#10;```" required></textarea><small class="field-help">Supports section titles (##), bullet lists (-), inline code (`code`), and fenced code blocks (```).</small><small class="field-error" th:errors="*{content}"></small></label><div class="admin-image-row"><img class="admin-image-preview article-preview" th:if="*{featuredImageUrl != null and !featuredImageUrl.isBlank()}" th:src="*{featuredImageUrl}" alt="Current featured image"><div class="admin-image-fields"><label><span>Upload featured image</span><input type="file" name="featuredImage" accept="image/jpeg,image/png,image/webp,image/gif,image/avif"><small class="field-help">JPG, PNG, WebP, GIF, or AVIF. Maximum 10 MB.</small></label><label><span>Featured image path / URL</span><input th:field="*{featuredImageUrl}"></label></div></div>
<div class="form-grid two"><label><span>Publication status</span><select th:field="*{status}"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status}">DRAFT</option></select></label></div><div class="check-row"><label><input type="checkbox" th:field="*{featured}"><span>Feature this post</span></label></div>
<div class="form-actions"><button class="button button-primary">Save blog post</button><a class="button button-ghost" th:href="@{/admin/blogs}">Cancel</a></div></form>
</main></div></div><script th:src="@{/js/admin.js}"></script></body></html>
