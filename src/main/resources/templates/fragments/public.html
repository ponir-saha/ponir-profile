<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" th:content="${profile.introduction}">
    <meta name="theme-color" content="#0d1117">
    <title th:text="${title + ' · ' + profile.fullName}">Ponir Kumer Saha</title>
    <script>
        (() => {
            const saved = localStorage.getItem('portfolio-theme');
            const preferred = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.dataset.theme = saved || preferred;
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<aside class="sidebar" id="site-sidebar" th:fragment="sidebar(active)">
    <button class="sidebar-close" type="button" data-menu-close aria-label="Close navigation">×</button>
    <a class="identity" th:href="@{/}">
        <span class="portrait-frame">
            <img th:src="${profile.portraitUrl}" th:alt="${profile.fullName}" class="portrait">
            <span class="availability-dot" title="Available for the right opportunity"></span>
        </span>
        <strong th:text="${profile.fullName}">Ponir Kumer Saha</strong>
        <span th:text="${profile.headline}">Principal Engineer</span>
    </a>

    <nav class="primary-nav" aria-label="Primary navigation">
        <a th:href="@{/}" th:classappend="${active == 'home'} ? 'active'">
            <span class="nav-icon">⌂</span> Home
        </a>
        <a th:href="@{/about}" th:classappend="${active == 'about'} ? 'active'">
            <span class="nav-icon">◎</span> About
        </a>
        <a th:href="@{/experience}" th:classappend="${active == 'experience'} ? 'active'">
            <span class="nav-icon">↗</span> Experience
        </a>
        <a th:href="@{/projects}" th:classappend="${active == 'projects'} ? 'active'">
            <span class="nav-icon">◇</span> Projects
        </a>
        <a th:href="@{/blog}" th:classappend="${active == 'blog'} ? 'active'">
            <span class="nav-icon">✦</span> Writing
        </a>
        <a th:href="@{/contact}" th:classappend="${active == 'contact'} ? 'active'">
            <span class="nav-icon">↘</span> Contact
        </a>
    </nav>

    <div class="sidebar-bottom">
        <p class="availability"><span></span><span th:text="${profile.availability}">Available</span></p>
        <div class="socials">
            <a th:if="${profile.linkedinUrl}" th:href="${profile.linkedinUrl}" target="_blank" rel="noreferrer" aria-label="LinkedIn">in</a>
            <a class="social-github" th:if="${profile.githubUrl}" th:href="${profile.githubUrl}" target="_blank" rel="noreferrer" aria-label="GitHub">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.3-.4 6.8-1.6 6.8-7A5.4 5.4 0 0 0 19.3 4 5 5 0 0 0 19.1.5S18 0 15 1.8a13.4 13.4 0 0 0-6 0C6 0 4.9.5 4.9.5A5 5 0 0 0 4.7 4a5.4 5.4 0 0 0-1.5 3.7c0 5.4 3.5 6.6 6.8 7A4.8 4.8 0 0 0 9 18v4M9 18c-4.5 2-5-2-7-2"/></svg>
            </a>
            <a th:if="${profile.whatsappUrl != null and !profile.whatsappUrl.isBlank()}" th:href="${profile.whatsappUrl}" target="_blank" rel="noreferrer" aria-label="WhatsApp">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 8.8 8.8 0 0 1-3.8-.9L3 21l1.7-5a8.5 8.5 0 1 1 16.3-4.5Z"/><path d="M8.5 8.4c.2-.5.4-.5.8-.5h.5c.2 0 .4.1.5.4l.8 1.8c.1.3.1.5-.1.7l-.6.8c-.2.2-.1.5.1.7.7 1.2 1.7 2.1 2.9 2.7.3.1.5.1.7-.1l.9-1.1c.2-.2.4-.3.7-.1l1.8.8c.3.1.4.3.4.5 0 .4-.2 1.5-.8 2-.6.5-1.4.8-2.3.6-1.3-.2-3.5-1.1-5.3-2.8-1.4-1.3-2.5-3.1-2.8-4.4-.2-.9 0-1.6.4-2Z"/></svg>
            </a>
            <a th:href="${'mailto:' + profile.email}" aria-label="Email">@</a>
        </div>
    </div>
</aside>

<header class="topbar" th:fragment="topbar(label)">
    <button class="menu-toggle" type="button" data-menu-open aria-label="Open navigation">☰</button>
    <span class="breadcrumb" th:text="${label}">Home</span>
    <div class="topbar-actions">
        <a class="topbar-link" th:href="@{/contact}">Let's talk</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">
            <span class="theme-sun">☀</span><span class="theme-moon">☾</span>
        </button>
    </div>
</header>

<footer class="site-footer" th:fragment="footer">
    <p>© <span th:text="${currentYear}">2026</span> <span th:text="${profile.fullName}">Ponir Kumer Saha</span>. Built with Spring Boot and thoughtful defaults.</p>
    <div>
        <a th:href="@{/admin}">Admin</a>
        <a th:if="${profile.resumeUrl}" th:href="${profile.resumeUrl}" target="_blank">Résumé</a>
    </div>
</footer>
</body>
</html>
