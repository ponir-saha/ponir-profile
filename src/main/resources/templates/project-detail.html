<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/public :: head(${project.title})}"></head>
<body>
<div class="site-shell">
    <aside th:replace="~{fragments/public :: sidebar('projects')}"></aside>
    <div class="page-panel">
        <header th:replace="~{fragments/public :: topbar('Project case study')}"></header>
        <main class="content-stack">
            <article class="detail-card reveal">
                <a class="back-link" th:href="@{/projects}">← All projects</a>
                <p class="eyebrow" th:text="${project.eyebrow}">Case study</p>
                <h1 th:text="${project.title}">Project</h1>
                <p class="lead" th:text="${project.summary}">Summary</p>
                <img class="project-featured-image" th:if="${project.imageUrl != null and !project.imageUrl.isBlank()}" th:src="${project.imageUrl}" th:alt="${project.title}">
                <div class="detail-divider"></div>
                <div class="detail-layout">
                    <div class="prose preserve-lines" th:text="${project.description}">Description</div>
                    <aside>
                        <p class="eyebrow">Technology</p>
                        <div class="tag-row wrap">
                            <span th:each="tech : ${#strings.arraySplit(project.techStack, ',')}" th:text="${#strings.trim(tech)}">Java</span>
                        </div>
                        <div class="detail-links">
                            <a th:if="${project.liveUrl != null and !project.liveUrl.isBlank()}" class="button button-primary full-width" th:href="${project.liveUrl}" target="_blank" rel="noreferrer">Open live project ↗</a>
                            <a th:if="${project.githubUrl != null and !project.githubUrl.isBlank()}" class="button button-ghost full-width github-button" th:href="${project.githubUrl}" target="_blank" rel="noreferrer">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.3-.4 6.8-1.6 6.8-7A5.4 5.4 0 0 0 19.3 4 5 5 0 0 0 19.1.5S18 0 15 1.8a13.4 13.4 0 0 0-6 0C6 0 4.9.5 4.9.5A5 5 0 0 0 4.7 4a5.4 5.4 0 0 0-1.5 3.7c0 5.4 3.5 6.6 6.8 7A4.8 4.8 0 0 0 9 18v4M9 18c-4.5 2-5-2-7-2"/></svg>
                                View source on GitHub
                            </a>
                        </div>
                    </aside>
                </div>
            </article>
        </main>
        <footer th:replace="~{fragments/public :: footer}"></footer>
    </div>
</div>
<div class="menu-backdrop" data-menu-close></div>
<script th:src="@{/js/site.js}"></script>
</body>
</html>
