<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/public :: head(${post.title})}"></head>
<body>
<div class="site-shell">
    <aside th:replace="~{fragments/public :: sidebar('blog')}"></aside>
    <div class="page-panel">
        <header th:replace="~{fragments/public :: topbar('Article')}"></header>
        <main class="content-stack article-shell">
            <article class="article-card reveal">
                <a class="back-link" th:href="@{/blog}">← All writing</a>
                <header>
                    <div class="blog-meta"><span th:text="${post.category}">Category</span><time th:text="${#temporals.format(post.publishedAt, 'MMMM dd, yyyy')}">Date</time></div>
                    <h1 class="article-title" th:text="${post.title}">Article title</h1>
                    <p class="lead" th:text="${post.excerpt}">Excerpt</p>
                </header>
                <img class="article-featured-image" th:if="${post.featuredImageUrl != null and !post.featuredImageUrl.isBlank()}" th:src="${post.featuredImageUrl}" th:alt="${post.title}">
                <div class="article-content" th:utext="${articleHtml}">Content</div>
                <footer class="article-author">
                    <img th:src="${profile.portraitUrl}" th:alt="${profile.fullName}">
                    <div><small>Written by</small><strong th:text="${profile.fullName}">Ponir Kumer Saha</strong><span th:text="${profile.headline}">Principal Engineer</span></div>
                </footer>
            </article>
            <section class="related-section" th:if="${!relatedPosts.isEmpty()}">
                <p class="eyebrow">Continue reading</p>
                <div class="related-grid">
                    <a th:each="related : ${relatedPosts}" th:href="@{/blog/{slug}(slug=${related.slug})}">
                        <small th:text="${related.category}">Category</small><strong th:text="${related.title}">Title</strong><span>Read →</span>
                    </a>
                </div>
            </section>
        </main>
        <footer th:replace="~{fragments/public :: footer}"></footer>
    </div>
</div>
<div class="menu-backdrop" data-menu-close></div>
<script th:src="@{/js/site.js}"></script>
</body>
</html>
